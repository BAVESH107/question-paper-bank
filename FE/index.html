<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QStack — Question Paper Archive</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ─── HEADER ─── -->
    <header>
        <div class="header-inner">
            <h1 class="brand">QStack</h1>
            <p class="tagline">Stack your papers. Ace your exams.</p>
        </div>
    </header>

    <!-- ─── MAIN CONTAINER ─── -->
    <div class="container">

        <!-- ─── FILTER BAR ─── -->
        <div class="filter-bar">
            <select id="deptFilter">
                <option value="">All Departments</option>
                <option value="COMP">COMP</option>
                <option value="IT">IT</option>
                <option value="ETC">ETC</option>
                <option value="EEE">EEE</option>
                <option value="MECH">MECH</option>
                <option value="CIVIL">CIVIL</option>
                <option value="VLSI">VLSI</option>
            </select>

            <select id="semFilter">
                <option value="">All Semesters</option>
                <option value="1">Sem 1</option>
                <option value="2">Sem 2</option>
                <option value="3">Sem 3</option>
                <option value="4">Sem 4</option>
                <option value="5">Sem 5</option>
                <option value="6">Sem 6</option>
                <option value="7">Sem 7</option>
                <option value="8">Sem 8</option>
            </select>

            <input type="number" id="yearFilter" placeholder="Year">

            <input type="text" id="searchInput" placeholder="Search by subject...">

            <button onclick="searchPapers()" class="btn-primary">Search</button>
            <button onclick="loadAllPapers()" class="btn-text">Reset</button>
        </div>

        <!-- ─── PAPERS LIST ─── -->
        <div id="papersList" class="papers-list">
            <p class="loading">Loading papers...</p>
        </div>

    </div>

    <!-- ─── FOOTER ─── -->
    <footer>
        <div class="footer-content">
            <p class="footer-title">Have QuestionPapers to share?</p>
            <a href="https://wa.me/917499679184?text=Hi!%20I%20have%20question%20paper%20to%20share%20with%20QStack."
              target="_blank"
              class="whatsapp-btn">
              Send on WhatsApp
            </a>
        </p class="footer-note">QStack Built for students, by the students</p>
        </div>
    </footer>

    <!-- ─── AI MODAL ─── -->
    <div id="aiModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); z-index:9999; justify-content:center; align-items:center; padding:20px;">
        <div style="background:white; max-width:600px; width:100%; max-height:80vh; overflow-y:auto; border-radius:10px; padding:30px; position:relative;">
            <button onclick="closeAIModal()" style="position:absolute; top:15px; right:15px; background:none; border:none; font-size:24px; cursor:pointer; color:#6B7280;">×</button>
            <div id="aiContent"><p>Loading...</p></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
