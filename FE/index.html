<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QStack</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ─── HEADER ─── -->
    <header>
        <h1>QStack</h1>
        <p class="subtitle">Stack Question papers, ace your exams</p>
    </header>

    <!-- ─── MAIN CONTAINER ─── -->
    <div class="container">

        <!-- ─── SEARCH + FILTERS ─── -->
        <div class="search-section">
            <input type="text" id="searchInput" placeholder="🔍 Search by subject...">

            <div class="filters">
                <select id="deptFilter">
                    <option value="">All Departments</option>
                    <option value="COMP">COMP</option>
                    <option value="IT">IT</option>
                    <option value="ETC">ETC</option>
                    <option value="EEE">EEE</option>
                    <option value="MECH">MECH</option>
                    <option value="CIVIL">CIVIL</option>
                    <option value="VLSI">VLSI</option>
                </select>

                <select id="semFilter">
                    <option value="">All Semesters</option>
                    <option value="1">Sem 1</option>
                    <option value="2">Sem 2</option>
                    <option value="3">Sem 3</option>
                    <option value="4">Sem 4</option>
                    <option value="5">Sem 5</option>
                    <option value="6">Sem 6</option>
                    <option value="7">Sem 7</option>
                    <option value="8">Sem 8</option>
                </select>

                <input type="number" id="yearFilter" placeholder="Year (e.g., 2024)">
            </div>

            <div class="button-row">
                <button onclick="searchPapers()">🔍 Search</button>
                <button onclick="loadAllPapers()" class="secondary">↻ Reset</button>
            </div>
        </div>

        <!-- ─── PAPERS LIST ─── -->
        <div id="papersList" class="papers-list">
            <p class="loading">Loading papers...</p>
        </div>

    </div>

    <script src="script.js"></script>
  <div id="aiModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); z-index:9999; justify-content:center; align-items:center; padding:20px;">
    <div style="background:white; max-width:600px; width:100%; max-height:80vh; overflow-y:auto; border-radius:20px; padding:30px; position:relative;">
        <button onclick="closeAIModal()" style="position:absolute; top:15px; right:15px; background:none; border:none; font-size:24px; cursor:pointer; color:#666;">×</button>
        <div id="aiContent"><p>Loading...</p></div>
    </div>
</div>
</body>
</html>
